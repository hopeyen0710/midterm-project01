:root { color-scheme: dark; font-family: "Microsoft JhengHei", "PingFang TC", sans-serif; color: #e9e5d9; background: #101815; }
* { box-sizing: border-box; }
body { margin: 0; min-width: 280px; background: radial-gradient(ellipse at 76% 36%, #293c31 0, #18271f 30%, #101815 72%); }
.entry { min-height: 100svh; padding: 32px clamp(24px, 7vw, 120px); display: flex; flex-direction: column; }
.entry-header { display: flex; justify-content: space-between; gap: 24px; color: #bdbcae; font-size: 14px; letter-spacing: .14em; padding-bottom: 24px; border-bottom: 1px solid #68756466; }
.entry-content { width: min(100%, 680px); margin-block: auto; padding-block: 76px; }
.eyebrow { color: #bdbcae; font-size: 14px; line-height: 1.8; letter-spacing: .13em; }
h1 { font-family: "PMingLiU", "Songti TC", serif; font-weight: 400; font-size: clamp(46px, 7vw, 88px); letter-spacing: .13em; margin: 24px 0; line-height: 1.25; }
.intro { color: #c6cbbf; line-height: 2; font-size: 17px; margin-bottom: 36px; }
.actions { display: flex; flex-wrap: wrap; gap: 12px; }
button { font: inherit; padding: 13px 24px; min-height: 48px; border: 1px solid #b8b99b; border-radius: 3px; background: #d6d2bd; color: #15231a; cursor: pointer; }
button.secondary { color: #e9e5d9; background: transparent; border-color: #8e9b84; }
button:hover:not(:disabled) { background: #f1ecd6; color: #15231a; }
button:focus-visible { outline: 3px solid #f0d48f; outline-offset: 5px; }
button:disabled { cursor: not-allowed; background: #3a473a; border-color: #68745e; color: #c3c8b7; }
.availability, footer { font-size: 13px; color: #b0baa7; line-height: 1.8; }
.availability { margin-top: 16px; }
footer { padding-top: 24px; border-top: 1px solid #68756466; }
footer span { margin-inline: 10px; }
dialog { width: min(480px, calc(100% - 32px)); max-height: calc(100svh - 32px); overflow-y: auto; padding: clamp(20px, 4vw, 36px); background: #1b2921; color: #e9e5d9; border: 1px solid #7d8c73; border-radius: 6px; line-height: 1.8; }
dialog::backdrop { background: #050b08cc; }
h2 { font-size: 24px; margin-top: 0; font-weight: 500; }
dl { display: grid; grid-template-columns: auto 1fr; gap: 16px 24px; margin-block: 28px; }
dt { color: #dfd2a8; } dd { margin: 0; }
@media (max-width: 480px) { .entry { padding: 24px; } .entry-content { padding-block: 48px; } .eyebrow { letter-spacing: .04em; } h1 { letter-spacing: .07em; } dl { gap: 12px; font-size: 14px; } }

[hidden] { display: none !important; }
.scene-screen { position: fixed; inset: 0; overflow: hidden; background: #111b18; }
.scene-viewport { position: absolute; inset: 0; }
.scene-viewport canvas { display: block; width: 100%; height: 100%; }
.scene-toolbar { position: absolute; inset: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 24px clamp(16px, 4vw, 64px); background: linear-gradient(#09110ee8, transparent); }
.scene-clock { margin-left: 20px; color: #d9c99f; font-variant-numeric: tabular-nums; }
.scene-actions { display: flex; gap: 12px; }
.scene-toolbar button { padding: 10px 16px; background: #15231bd9; }
.scene-message { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(460px, calc(100% - 40px)); padding: 24px; border: 1px solid #83917c; border-radius: 6px; background: #15231bf2; text-align: center; line-height: 1.9; }
.scene-message p { margin-top: 0; }
.scene-message p:last-child { margin-bottom: 0; }
.scene-caption { position: absolute; bottom: 16px; left: 20px; right: 20px; margin: 0; padding: 12px; text-align: center; color: #d8dece; font-size: 13px; background: #101815c9; border-radius: 4px; pointer-events: none; }
@media (max-width: 480px) { .scene-toolbar { align-items: flex-start; padding: 16px; font-size: 13px; } .scene-clock { display: block; margin: 4px 0 0; } .scene-actions { gap: 8px; } .scene-toolbar button { padding: 8px 10px; font-size: 13px; } }

.area-label { display: flex; align-items: center; gap: 8px; font-size: 14px; } select { color: #eee7d7; background: #19281f; border: 1px solid #8e9b84; border-radius: 3px; padding: 10px; font: inherit; }
@media(max-width:480px) { .scene-toolbar {flex-wrap:wrap;} .scene-actions {flex-wrap:wrap;} .area-label {font-size:12px;} select {padding:8px;} }

.explore-prompt { position: absolute; left: 50%; bottom: 90px; transform: translateX(-50%); width: min(440px, calc(100% - 32px)); text-align: center; padding: 18px; background: #102019ec; border: 1px solid #819379; border-radius: 6px; } .explore-prompt p { margin: 12px 0 0; font-size: 13px; color: #d4dccd; line-height: 1.7; }

.reticle { position:absolute; top:50%; left:50%; width:8px; height:8px; transform:translate(-50%,-50%); border:1px solid #fff; border-radius:50%; background:#ffffff88; box-shadow:0 0 0 2px #0006; pointer-events:none; }
.reticle.has-target { width:14px; height:14px; background:#e4cf8588; border-color:#ffe3a0; }
.interaction-hint { position:absolute; top:calc(50% + 20px); left:50%; transform:translateX(-50%); margin:0; max-width:calc(100% - 32px); padding:9px 16px; border-radius:4px; background:#0d1a15ed; color:#f0e5c8; font-size:14px; pointer-events:none; text-align:center; }
.interaction-feedback { position:absolute; left:50%; bottom:155px; transform:translateX(-50%); width:min(540px,calc(100% - 32px)); padding:16px 20px; margin:0; border-left:3px solid #c8b179; border-radius:3px; background:#112017ed; color:#eee7d7; line-height:1.8; pointer-events:none; }

  <body>
    <main id="entry-screen" class="entry" aria-labelledby="game-title">
      <header class="entry-header"><span>時空密室</span><span aria-label="故事開始時間">23:30</span></header>
      <div class="entry-content">
        <p class="eyebrow">一封求救信，一場尚未結束的典禮</p>
        <h1 id="game-title">午夜之前</h1>
        <p class="intro">走進城堡，尋找被封存的真相。<br />為艾琳找出一條離開的路。</p>
        <div class="actions">
          <button type="button" id="scene-button" aria-describedby="availability">進入城堡</button>
          <button class="secondary" type="button" id="help-button">操作說明</button>
        </div>
        <p id="availability" class="availability" role="status">WASD 移動 · 滑鼠環視；F 鍵互動已開放；完整劇情待加入</p>
        <noscript><p>請啟用 JavaScript，以載入遊戲。</p></noscript>
      </div>
      <footer>3D 密室逃脫 <span aria-hidden="true">·</span> 單人探索</footer>
    </main>
    <section id="scene-screen" class="scene-screen" aria-label="城堡場景預覽" hidden>
      <div id="scene-viewport" class="scene-viewport" data-state="idle"></div>
      <header class="scene-toolbar">
        <span><span id="room-location">中央大廳</span> <span class="scene-clock">23:30</span></span>
        <div class="scene-actions"><label class="area-label">區域 <select id="area-select"><option value="hall">城堡內</option><option value="outside">城堡外</option></select></label>
          <button type="button" class="secondary" id="scene-help-button">操作說明</button>
          <button type="button" class="secondary" id="back-button">返回首頁</button>
        </div>
      </header>
      <div id="scene-message" class="scene-message" role="status" aria-live="polite">
        <p id="scene-status">正在準備場景…</p>
        <button type="button" id="retry-button" hidden>重新嘗試</button>
      </div>
      <p id="scene-caption" class="scene-caption" hidden>WASD 移動 · 滑鼠環視 · Esc 釋放游標 · F 互動</p>
      <div id="reticle" class="reticle" aria-hidden="true" hidden></div>
      <p id="interaction-hint" class="interaction-hint" role="status" hidden></p>
      <p id="interaction-feedback" class="interaction-feedback" role="status" hidden></p>
      <div id="explore-prompt" class="explore-prompt" hidden>
        <button type="button" id="explore-button">開始探索</button>
        <p id="explore-status">WASD 移動 · 滑鼠環視 · Esc 釋放游標</p>
      </div>
    </section>
    <dialog id="help-dialog" aria-labelledby="help-title">
      <h2 id="help-title">操作說明</h2>
      <p>探索開放後，使用以下操作：</p>
      <dl><dt>W A S D</dt><dd>前、左、後、右移動</dd><dt>滑鼠</dt><dd>環顧四周</dd><dt>F</dt><dd>與眼前的物品互動</dd><dt>Esc</dt><dd>離開滑鼠鎖定或關閉說明</dd></dl>
      <form method="dialog"><button type="submit">關閉說明</button></form>
    </dialog>
